name: Build omo ReVanced patches

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check_assets.py'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check_assets.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: omo-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patches:
    name: Validate resources and build patch bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate icons and patch sources
        run: python3 scripts/check_assets.py
      - name: Compile ReVanced patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace
      - name: Verify patch bundle exists
        run: |
          find patches/build -type f \( -name '*.rvp' -o -name '*.jar' \) -print
          test -n "$(find patches/build -type f -name '*.rvp' -print -quit)"
      - name: Upload patch bundle (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: omo-revanced-patches
          path: patches/build/**/*.rvp
          if-no-files-found: error
          retention-days: 14
