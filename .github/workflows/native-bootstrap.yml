name: Bootstrap omo native Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omo-native-bootstrap
  cancel-in-progress: false

jobs:
  import:
    name: Import and brand native sources
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import Metrolist and apply omo theme
        run: |
          if [ ! -f native/UPSTREAM.md ]; then
            python3 scripts/import_native.py
          else
            echo 'Native source already imported; skipping.'
          fi
      - name: Publish source snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/
          if ! git diff --cached --quiet; then
            git commit -m "feat(native): import GPL Metrolist sources with omo branding"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new sources to publish.'
          fi

  build:
    name: Build Android debug APK
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble omo Music
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: omo-music-debug-apk
          path: native/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
