name: Test Android 17-compatible omo Music engine

on:
  push:
    branches: [fix/android17-intertune]
    paths:
      - 'scripts/import_android17.py'
      - '.github/workflows/android17-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import_android17.py'
      - '.github/workflows/android17-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omo-android17-bootstrap
  cancel-in-progress: false

jobs:
  test-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android17-intertune
          persist-credentials: true
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Import functional YouTube Music source (InterTune v0.12.11)
        run: |
          if [ ! -d client-next ]; then python3 scripts/import_android17.py; fi
          test -f client-next/innertube/build.gradle.kts
          test -f client-next/sabr/build.gradle.kts
          test -f client-next/app/src/main/AndroidManifest.xml
      - name: Compile and package omo Music for Android
        working-directory: client-next
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleCoreDebug --no-daemon --max-workers=2 --stacktrace
      - name: Verify signed debug APK and print ABI
        run: |
          find client-next/app/build/outputs/apk/core/debug -name '*.apk' -print
          APK=$(find client-next/app/build/outputs/apk/core/debug -name '*universal*.apk' -print -quit)
          if [ -z "$APK" ]; then APK=$(find client-next/app/build/outputs/apk/core/debug -name '*.apk' -print -quit); fi
          test -n "$APK"
          apksigner verify --verbose "$APK"
          echo "Validated APK $APK"
          zipinfo -1 "$APK" | grep '^lib/' | head -40 || true
      - name: Preserve complete source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-next
          if ! git diff --cached --quiet; then
            git commit -m 'feat(android): add tested InterTune-based omo Music client'
            git pull --rebase origin fix/android17-intertune
            git push origin HEAD:fix/android17-intertune
          fi
      - name: Publish APK test artifact
        uses: actions/upload-artifact@v4
        with:
          name: omo-music-android17-test
          path: client-next/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
          retention-days: 14
