name: Build omo Music Android

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compile and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK matching upstream project
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "build-tools;36.0.0" "platforms;android-35" "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: omo-music-debug
          path: native/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
