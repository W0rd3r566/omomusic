name: Bootstrap omo Music Android

on:
  workflow_dispatch:
  push:
    branches: [feat/omo-android]
    paths:
      - 'scripts/import_omo_android.py'
      - '.github/workflows/omo-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: omo-native-import
  cancel-in-progress: false

jobs:
  import-and-build:
    name: Import original client and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out omo repository
        uses: actions/checkout@v4
        with:
          ref: feat/omo-android
          persist-credentials: true
      - name: Import upstream engine and omo UI
        run: |
          if [ -d client ]; then
            echo 'client/ exists; skipping importer'
          else
            python3 scripts/import_omo_android.py
          fi
      - name: Save source snapshot in branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client
          if ! git diff --cached --quiet; then
            git commit -m "feat(android): import OuterTune engine and custom omo UI"
            git pull --rebase origin feat/omo-android
            git push origin HEAD:feat/omo-android
          fi
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build omo Music APK
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleCoreDebug --no-daemon --max-workers=2 --stacktrace -DskipFormatKtlint
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omo-music-native-debug
          path: client/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
          retention-days: 14
